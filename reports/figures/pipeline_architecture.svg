<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" style="background-color:#ffffff; font-family:'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2c3e50" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1a5276" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b03a2e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e8449" />
    </marker>
    <!-- Drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title & Legend -->
  <text x="640" y="32" font-size="20" font-weight="bold" fill="#1b2631" text-anchor="middle">5-Stage Pipelined RISC-V (RV32I) Processor Architecture</text>
  <text x="640" y="52" font-size="12" fill="#566573" text-anchor="middle">Team Scaler MCA Project - Stage Datapath, Pipeline Registers, and Forwarding Paths</text>

  <!-- Stage Background Bands -->
  <!-- IF -->
  <rect x="30" y="70" width="200" height="520" rx="6" fill="#ebf5fb" stroke="#aed6f1" stroke-width="1.5" />
  <text x="130" y="92" font-size="14" font-weight="bold" fill="#1b4f72" text-anchor="middle">IF STAGE (M1)</text>

  <!-- ID -->
  <rect x="270" y="70" width="210" height="520" rx="6" fill="#ebf5fb" stroke="#aed6f1" stroke-width="1.5" />
  <text x="375" y="92" font-size="14" font-weight="bold" fill="#1b4f72" text-anchor="middle">ID STAGE (M2)</text>

  <!-- EX -->
  <rect x="520" y="70" width="220" height="520" rx="6" fill="#ebf5fb" stroke="#aed6f1" stroke-width="1.5" />
  <text x="630" y="92" font-size="14" font-weight="bold" fill="#1b4f72" text-anchor="middle">EX STAGE (M3)</text>

  <!-- MEM -->
  <rect x="780" y="70" width="180" height="520" rx="6" fill="#fef9e7" stroke="#f9e79f" stroke-dasharray="4,4" stroke-width="1.5" />
  <text x="870" y="92" font-size="14" font-weight="bold" fill="#7d6608" text-anchor="middle">MEM STAGE (M4 - Pending)</text>

  <!-- WB -->
  <rect x="1000" y="70" width="150" height="520" rx="6" fill="#fef9e7" stroke="#f9e79f" stroke-dasharray="4,4" stroke-width="1.5" />
  <text x="1075" y="92" font-size="14" font-weight="bold" fill="#7d6608" text-anchor="middle">WB STAGE (M5 - Pending)</text>

  <!-- PIPELINE REGISTERS (Vertical Dividers) -->
  <!-- IF/ID Reg -->
  <rect x="235" y="110" width="28" height="460" rx="4" fill="#2e4053" stroke="#1c2833" stroke-width="1.5" filter="url(#shadow)" />
  <text x="249" y="345" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90, 249, 345)">IF / ID REGISTER</text>

  <!-- ID/EX Reg -->
  <rect x="485" y="110" width="28" height="460" rx="4" fill="#2e4053" stroke="#1c2833" stroke-width="1.5" filter="url(#shadow)" />
  <text x="499" y="345" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90, 499, 345)">ID / EX REGISTER</text>

  <!-- EX/MEM Reg -->
  <rect x="745" y="110" width="28" height="460" rx="4" fill="#2e4053" stroke="#1c2833" stroke-width="1.5" filter="url(#shadow)" />
  <text x="759" y="345" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90, 759, 345)">EX / MEM REGISTER</text>

  <!-- MEM/WB Reg -->
  <rect x="965" y="110" width="28" height="460" rx="4" fill="#7f8c8d" stroke="#34495e" stroke-dasharray="3,3" stroke-width="1.5" filter="url(#shadow)" />
  <text x="979" y="345" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90, 979, 345)">MEM / WB REGISTER</text>

  <!-- ==================== IF STAGE MODULES ==================== -->
  <!-- PC Mux -->
  <polygon points="45,260 55,270 55,310 45,320" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <text x="50" y="293" font-size="9" fill="#2c3e50" text-anchor="middle">MUX</text>

  <!-- PC Register -->
  <rect x="75" y="265" width="45" height="50" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="97" y="287" font-size="11" font-weight="bold" fill="#1a5276" text-anchor="middle">PC</text>
  <text x="97" y="302" font-size="8" fill="#566573" text-anchor="middle">pc.v</text>

  <!-- PC+4 Adder -->
  <polygon points="140,165 170,180 170,210 140,225 140,200 145,195 140,190" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <text x="153" y="198" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">+4</text>

  <!-- Instruction Memory -->
  <rect x="140" y="255" width="80" height="70" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="180" y="285" font-size="11" font-weight="bold" fill="#1a5276" text-anchor="middle">Instruction</text>
  <text x="180" y="299" font-size="11" font-weight="bold" fill="#1a5276" text-anchor="middle">Memory</text>
  <text x="180" y="315" font-size="8" fill="#566573" text-anchor="middle">instr_mem.v</text>

  <!-- IF Connections -->
  <line x1="55" y1="290" x2="75" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="120" y1="290" x2="140" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- PC to Adder & IF/ID -->
  <line x1="130" y1="290" x2="130" y2="195" stroke="#2c3e50" stroke-width="1.5" />
  <line x1="130" y1="195" x2="140" y2="195" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="170" y1="195" x2="235" y2="195" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Adder back to Mux -->
  <polyline points="190,195 190,140 40,140 40,275 45,275" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="220" y1="290" x2="235" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== ID STAGE MODULES ==================== -->
  <!-- Instruction Decoder -->
  <rect x="280" y="150" width="85" height="80" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="322" y="182" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">Instruction</text>
  <text x="322" y="196" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">Decoder</text>
  <text x="322" y="212" font-size="8" fill="#566573" text-anchor="middle">decoder.v</text>

  <!-- Main Control -->
  <rect x="280" y="255" width="85" height="80" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="322" y="287" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">Main Control</text>
  <text x="322" y="301" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">Unit</text>
  <text x="322" y="317" font-size="8" fill="#566573" text-anchor="middle">main_control.v</text>

  <!-- Register File -->
  <rect x="380" y="250" width="95" height="150" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="427" y="278" font-size="11" font-weight="bold" fill="#1a5276" text-anchor="middle">Register File</text>
  <text x="427" y="293" font-size="9" fill="#566573" text-anchor="middle">(32 x 32-bit)</text>
  <text x="427" y="308" font-size="8" fill="#27ae60" text-anchor="middle">x0 = 0 | WB Bypass</text>
  <text x="395" y="335" font-size="9" fill="#2c3e50">rs1_data</text>
  <text x="395" y="375" font-size="9" fill="#2c3e50">rs2_data</text>
  <text x="427" y="392" font-size="8" fill="#566573" text-anchor="middle">register_file.v</text>

  <!-- ID Connections -->
  <line x1="263" y1="290" x2="275" y2="290" stroke="#2c3e50" stroke-width="1.5" />
  <polyline points="275,290 275,190 280,190" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="275" y1="290" x2="280" y2="290" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Decoder to Regfile & ID/EX -->
  <polyline points="365,170 375,170 375,320 380,320" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="365,190 370,190 370,350 380,350" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Imm to ID/EX -->
  <polyline points="365,210 475,210 475,440 485,440" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="430" y="205" font-size="8" fill="#566573">imm_ext</text>
  <!-- Control to ID/EX -->
  <line x1="365" y1="280" x2="485" y2="280" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="375" y="275" font-size="8" fill="#566573">control signals</text>
  <!-- Reg data to ID/EX -->
  <line x1="475" y1="330" x2="485" y2="330" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="475" y1="370" x2="485" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== EX STAGE MODULES ==================== -->
  <!-- Forwarding Mux A -->
  <polygon points="535,310 545,317 545,343 535,350" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <text x="540" y="333" font-size="8" fill="#2c3e50" text-anchor="middle">MUX</text>

  <!-- Forwarding Mux B -->
  <polygon points="535,370 545,377 545,403 535,410" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <text x="540" y="393" font-size="8" fill="#2c3e50" text-anchor="middle">MUX</text>

  <!-- ALU Imm Mux -->
  <polygon points="575,385 585,392 585,418 575,425" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <text x="580" y="408" font-size="7" fill="#2c3e50" text-anchor="middle">MUX</text>

  <!-- ALU Control -->
  <rect x="545" y="240" width="75" height="55" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="582" y="263" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">ALU Ctrl</text>
  <text x="582" y="277" font-size="8" fill="#566573" text-anchor="middle">alu_control.v</text>

  <!-- ALU Module -->
  <polygon points="625,320 670,345 670,395 625,420 625,380 635,370 625,360" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="650" y="374" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">ALU</text>
  <text x="650" y="440" font-size="8" fill="#566573" text-anchor="middle">alu.v (ADD/SUB)</text>

  <!-- Branch Unit -->
  <rect x="615" y="160" width="95" height="65" rx="3" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)" />
  <text x="662" y="183" font-size="10" font-weight="bold" fill="#1a5276" text-anchor="middle">Branch Unit</text>
  <text x="662" y="197" font-size="8" fill="#27ae60" text-anchor="middle">BEQ / BNE target</text>
  <text x="662" y="211" font-size="8" fill="#566573" text-anchor="middle">branch_unit.v</text>

  <!-- EX Connections -->
  <line x1="513" y1="330" x2="535" y2="330" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="513" y1="390" x2="535" y2="390" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="545" y1="330" x2="625" y2="345" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="545" y1="390" x2="575" y2="395" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Imm to Mux -->
  <line x1="513" y1="440" x2="565" y2="440" stroke="#2c3e50" stroke-width="1.5" />
  <polyline points="565,440 565,415 575,415" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="585" y1="405" x2="625" y2="395" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- ALU Ctrl to ALU -->
  <line x1="620" y1="270" x2="645" y2="270" stroke="#2c3e50" stroke-width="1.5" />
  <line x1="645" y1="270" x2="645" y2="332" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- ALU to EX/MEM -->
  <line x1="670" y1="370" x2="745" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="705" y="363" font-size="8" fill="#1a5276" text-anchor="middle">alu_result</text>

  <!-- Branch Target to PC Mux (Redirect) -->
  <polyline points="710,185 725,185 725,115 50,115 50,265" fill="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
  <text x="380" y="110" font-size="9" font-weight="bold" fill="#b03a2e" text-anchor="middle">Branch Target Address (Redirect PC on taken branch)</text>

  <!-- ==================== MEM STAGE MODULES (Planned M4) ==================== -->
  <!-- Data Memory -->
  <rect x="810" y="310" width="95" height="120" rx="3" fill="#ffffff" stroke="#7d6608" stroke-dasharray="3,3" stroke-width="1.5" filter="url(#shadow)" />
  <text x="857" y="345" font-size="11" font-weight="bold" fill="#7d6608" text-anchor="middle">Data Memory</text>
  <text x="857" y="363" font-size="9" fill="#7d6608" text-anchor="middle">data_mem.v</text>
  <text x="857" y="385" font-size="8" fill="#99a3a4" text-anchor="middle">LW (Read) / SW (Write)</text>
  <text x="857" y="405" font-size="8" fill="#e67e22" text-anchor="middle">[Planned - M4]</text>

  <!-- MEM Connections -->
  <line x1="773" y1="370" x2="810" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="773,370 790,370 790,460 965,460" fill="none" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="875" y="455" font-size="8" fill="#566573">ALU Result Bypass</text>
  <line x1="905" y1="370" x2="965" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="935" y="363" font-size="8" fill="#566573">read_data</text>

  <!-- ==================== WB STAGE MODULES (Planned M5) ==================== -->
  <!-- WB Mux -->
  <polygon points="1030,350 1045,360 1045,470 1030,480" fill="#ffffff" stroke="#7d6608" stroke-dasharray="3,3" stroke-width="1.5" />
  <text x="1038" y="418" font-size="8" fill="#7d6608" text-anchor="middle">MUX</text>

  <line x1="993" y1="370" x2="1030" y2="370" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="993" y1="460" x2="1030" y2="460" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- WB Feedback to Register File -->
  <polyline points="1045,415 1070,415 1070,550 410,550 410,400" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="740" y="542" font-size="10" font-weight="bold" fill="#1e8449" text-anchor="middle">WB Feedback Data Path (wb_data, wb_rd, wb_write_en) [M5]</text>

  <!-- ==================== FORWARDING PATHS (M3 Implemented) ==================== -->
  <!-- EX/MEM Forwarding to EX Stage Muxes -->
  <polyline points="760,320 760,500 525,500 525,340 535,340" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <polyline points="525,400 535,400" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="630" y="493" font-size="9" font-weight="bold" fill="#2980b9" text-anchor="middle">Forwarding Path: EX/MEM to EX (forward = 2&#39;b10)</text>

  <!-- Bottom Legend -->
  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="1120" height="45" rx="4" fill="#f8f9f9" stroke="#d5dbdb" stroke-width="1" />
    <circle cx="25" cy="22" r="7" fill="#2e4053" />
    <text x="38" y="26" font-size="10" font-weight="bold" fill="#2c3e50">Pipeline Registers (Synchronous reset, hold, flush)</text>

    <rect x="330" y="15" width="14" height="14" rx="2" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" />
    <text x="350" y="26" font-size="10" fill="#1a5276">Implemented &amp; Verified (M1-M3)</text>

    <rect x="545" y="15" width="14" height="14" rx="2" fill="#fef9e7" stroke="#7d6608" stroke-dasharray="3,3" stroke-width="1.5" />
    <text x="565" y="26" font-size="10" fill="#7d6608">Upcoming / Planned (M4-M5)</text>

    <line x1="745" y1="22" x2="775" y2="22" stroke="#2980b9" stroke-width="2" />
    <text x="782" y="26" font-size="10" fill="#2980b9">Forwarding Path</text>

    <line x1="880" y1="22" x2="910" y2="22" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="917" y="26" font-size="10" fill="#b03a2e">Branch Redirect</text>

    <line x1="1010" y1="22" x2="1040" y2="22" stroke="#1e8449" stroke-width="2" />
    <text x="1047" y="26" font-size="10" fill="#1e8449">WB Commit</text>
  </g>
</svg>